<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 224" width="224" height="224" role="img" aria-label="MinerU">
  <!--
    MinerU 身份图标（manifest.icon）：白底 + 黑色 MinerU 标记。

    标记取自 logo_muia1hbq.svg（viewBox 0 0 24 24）。原文件里每个形状画了两遍：
    先一条「白 → #2E2E2E」的渐变版，再一条路径完全相同的实心 #010101 版。
    后画的盖在上面，所以渐变版被完全遮挡、在白底上也不可见。
    这里只保留实心那条，去掉三条不可见路径与配套的渐变定义，视觉结果不变。

    标记在 24 坐标系里的包围盒：x 2.62109 到 21.3826、y 2.5879 到 21.4111，
    中心恰好是 (12, 12)，本来就居中，所以只需整体缩放加平移。
    scale(7) 把 24 坐标系铺成 168 单位，标记约占画布 58.6%（131.3/224）；
    translate(28 28) 把 168 的方块居中到 224 画布，四周各留 28。

    画布取正方形（224 × 224）：非正方形会被宿主「补透明留白」处理，白底就盖不满整块。

    这里刻意不做自带圆角（原先写的 rx="51" 已去掉）。
    宿主自己会给应用图标加圆角，用的是宿主的设计令牌：
      border-radius: calc(var(radius-lg) * var(corner-radius-scale, 1))
      corner-shape: squircle
    常规 44px 尺寸下 radius-lg 是 16px、corner-radius-scale 是 1.8409
    （需要 corner-shape: squircle 支持，Edge / Chromium 139 起），
    实际圆角约 29.45px，占方框 66.9%，而且是圆角矩形（squircle）而非圆弧。
    所以自带圆角既多余又有害：我的是圆弧、宿主的是 squircle，两者半径接近时
    圆弧边界会被拆得很碎。参照对象 DSHana 的图标就是一张满幅不透明 PNG
    （四角 alpha 全 255），圆角完全由宿主完成，保持满幅就与它自然一致。

    注意：XML 注释里不能出现连续两个短横，所以上面的 CSS 变量名省去了前缀。
  -->
  <rect width="224" height="224" fill="#FFFFFF"/>
  <g transform="translate(28 28) scale(7)" fill="#010101">
    <path d="M19.7238 3.86898C19.7238 4.57597 19.1502 5.1491 18.4427 5.1491C17.7352 5.1491 17.1616 4.57597 17.1616 3.86898C17.1616 3.16199 17.7352 2.58887 18.4427 2.58887C19.1502 2.58887 19.7238 3.16199 19.7238 3.86898Z"/>
    <path d="M15.3681 5.1491C15.3681 5.85609 14.7945 6.42921 14.087 6.42921C13.3794 6.42921 12.8059 5.85609 12.8059 5.1491C12.8059 4.44211 13.3794 3.86898 14.087 3.86898C14.7945 3.86898 15.3681 4.44211 15.3681 5.1491Z"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M8.05175 11.2368C8.05175 13.4605 9.14375 15.4293 10.8211 16.6371C11.8241 15.7389 12.4551 14.4345 12.4551 12.9828V9.39673C12.4551 8.85661 12.8197 8.38448 13.3426 8.24757L19.8924 6.53265C20.6459 6.33534 21.3826 6.90341 21.3826 7.6818L21.3826 12.0452C21.3826 17.2179 17.1861 21.4111 12.0095 21.4111L11.9942 21.4111C6.81758 21.4111 2.62109 17.2179 2.62109 12.0452V9.03388C2.62109 8.49175 2.9884 8.01839 3.51385 7.88336L6.56677 7.09882C7.31904 6.9055 8.05175 7.47318 8.05175 8.24934V11.2368ZM3.9798 12.0452C3.9798 13.8476 4.57565 15.5108 5.58124 16.849C6.04996 17.4728 6.7655 17.8884 7.54573 17.8884V17.8884C8.28848 17.8884 8.9927 17.7236 9.62376 17.4286C7.83439 15.9596 6.69304 13.7314 6.69304 11.2368V8.46821L3.9798 9.16546V12.0452Z"/>
  </g>
</svg>
